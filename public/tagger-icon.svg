<svg

  xmlns="http://www.w3.org/2000/svg"

  viewBox="0 0 1024 1024"

  width="200"

  height="200"

  version="1.1"

>

  <defs>

    <!-- ===================================================== -->

    <!-- 柔和、多色、低饱和的色盘 -->

    <!-- ===================================================== -->

    <linearGradient id="sectorRedPink"

      x1="0%" y1="0%" x2="100%" y2="100%">

      <stop offset="0%" stop-color="#E89A9A"/>

      <stop offset="100%" stop-color="#D98BA5"/>

    </linearGradient>

    <linearGradient id="sectorPinkPurple"

      x1="0%" y1="0%" x2="100%" y2="100%">

      <stop offset="0%" stop-color="#D98BA5"/>

      <stop offset="100%" stop-color="#A99BCB"/>

    </linearGradient>

    <linearGradient id="sectorPurpleBlue"

      x1="0%" y1="0%" x2="100%" y2="100%">

      <stop offset="0%" stop-color="#A99BCB"/>

      <stop offset="100%" stop-color="#7FA7C7"/>

    </linearGradient>

    <linearGradient id="sectorBlueCyan"

      x1="0%" y1="0%" x2="100%" y2="100%">

      <stop offset="0%" stop-color="#7FA7C7"/>

      <stop offset="100%" stop-color="#75BDB8"/>

    </linearGradient>

    <linearGradient id="sectorCyanGreen"

      x1="0%" y1="0%" x2="100%" y2="100%">

      <stop offset="0%" stop-color="#75BDB8"/>

      <stop offset="100%" stop-color="#91BE91"/>

    </linearGradient>

    <linearGradient id="sectorGreenYellow"

      x1="0%" y1="0%" x2="100%" y2="100%">

      <stop offset="0%" stop-color="#91BE91"/>

      <stop offset="100%" stop-color="#C5C783"/>

    </linearGradient>

    <linearGradient id="sectorYellowOrange"

      x1="0%" y1="0%" x2="100%" y2="100%">

      <stop offset="0%" stop-color="#C5C783"/>

      <stop offset="100%" stop-color="#D7AE7D"/>

    </linearGradient>

    <linearGradient id="sectorOrangeRed"

      x1="0%" y1="0%" x2="100%" y2="100%">

      <stop offset="0%" stop-color="#D7AE7D"/>

      <stop offset="100%" stop-color="#D89286"/>

    </linearGradient>

    <!-- 中央非常轻的柔光 -->

    <radialGradient id="centerLight">

      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.48"/>

      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0.12"/>

      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>

    </radialGradient>

    <!-- 标签颜色 -->

    <linearGradient id="tagGradient"

      x1="0%" y1="100%" x2="100%" y2="0%">

      <stop offset="0%" stop-color="#D98BA5"/>

      <stop offset="28%" stop-color="#A99BCB"/>

      <stop offset="52%" stop-color="#7FA7C7"/>

      <stop offset="76%" stop-color="#75BDB8"/>

      <stop offset="100%" stop-color="#C5C783"/>

    </linearGradient>

    <!-- 标签阴影 -->

    <filter

      id="tagShadow"

      x="-40%"

      y="-40%"

      width="180%"

      height="180%"

    >

      <feDropShadow

        dx="0"

        dy="10"

        stdDeviation="10"

        flood-color="#1E2633"

        flood-opacity="0.16"

      />

    </filter>

    <!-- 橘子裁剪区域 -->

    <clipPath id="orangeClip">

      <path

        d="

        M514 328.1

        c39.2 0 77.2 7.7 113 22.8

        34.6 14.6 65.6 35.5 92.3 62.2

        s47.6 57.7 62.2 92.3

        c15.1 35.8 22.8 73.8 22.8 113

        s-7.7 77.2-22.8 113

        c-14.6 34.6-35.5 65.6-62.2 92.3

        s-57.7 47.6-92.3 62.2

        c-35.8 15.1-73.8 22.8-113 22.8

        s-77.2-7.7-113-22.8

        c-34.6-14.6-65.6-35.5-92.3-62.2

        s-47.6-57.7-62.2-92.3

        c-15.1-35.8-22.8-73.8-22.8-113

        s7.7-77.2 22.8-113

        c14.6-34.6 35.5-65.6 62.2-92.3

        s57.7-47.6 92.3-62.2

        c35.8-15.1 73.8-22.8 113-22.8

        z"

      />

    </clipPath>

  </defs>

  <!-- ===================================================== -->

  <!-- 橘子本体：圆形色盘 -->

  <!-- ===================================================== -->

  <g clip-path="url(#orangeClip)">

    <!--

      每一个 wedge 都从中心点 514,618 开始，

      像切蛋糕一样向外展开。

      颜色按照：

      红 → 粉 → 紫 → 蓝 → 青 → 绿 → 黄 → 橙

      再回到红。

    -->

    <!-- 红 -->

    <path

      d="M514 618

         L514 300

         A318 318 0 0 1 756 412

         Z"

      fill="url(#sectorRedPink)"

    />

    <!-- 粉 -->

    <path

      d="M514 618

         L756 412

         A318 318 0 0 1 830 618

         Z"

      fill="url(#sectorPinkPurple)"

    />

    <!-- 紫 -->

    <path

      d="M514 618

         L830 618

         A318 318 0 0 1 756 824

         Z"

      fill="url(#sectorPurpleBlue)"

    />

    <!-- 蓝 -->

    <path

      d="M514 618

         L756 824

         A318 318 0 0 1 514 936

         Z"

      fill="url(#sectorBlueCyan)"

    />

    <!-- 青 -->

    <path

      d="M514 618

         L514 936

         A318 318 0 0 1 272 824

         Z"

      fill="url(#sectorCyanGreen)"

    />

    <!-- 绿 -->

    <path

      d="M514 618

         L272 824

         A318 318 0 0 1 198 618

         Z"

      fill="url(#sectorGreenYellow)"

    />

    <!-- 黄 -->

    <path

      d="M514 618

         L198 618

         A318 318 0 0 1 272 412

         Z"

      fill="url(#sectorYellowOrange)"

    />

    <!-- 橙 -->

    <path

      d="M514 618

         L272 412

         A318 318 0 0 1 514 300

         Z"

      fill="url(#sectorOrangeRed)"

    />

    <!-- ================================================= -->

    <!-- 第二层扇区 -->

    <!-- 让边界不那么机械，形成更自然的色盘 -->

    <!-- ================================================= -->

    <g opacity="0.38">

      <path

        d="M514 618 L610 315 A318 318 0 0 1 682 350 Z"

        fill="#E7A6A6"

      />

      <path

        d="M514 618 L785 470 A318 318 0 0 1 815 535 Z"

        fill="#B69DC4"

      />

      <path

        d="M514 618 L815 690 A318 318 0 0 1 785 765 Z"

        fill="#84A9CA"

      />

      <path

        d="M514 618 L625 915 A318 318 0 0 1 550 934 Z"

        fill="#86C5B9"

      />

      <path

        d="M514 618 L315 860 A318 318 0 0 1 255 805 Z"

        fill="#A4BF94"

      />

    </g>

    <!-- ================================================= -->

    <!-- 中心柔和高光 -->

    <!-- ================================================= -->

    <ellipse

      cx="514"

      cy="618"

      rx="210"

      ry="210"

      fill="url(#centerLight)"

    />

    <!-- 非常轻的纸张质感 -->

    <path

      d="

      M190 440

      Q510 310 840 485

      Q865 515 848 540

      Q520 400 190 535

      Z"

      fill="#FFFFFF"

      opacity="0.045"

    />

  </g>

  <!-- ===================================================== -->

  <!-- 橘子外轮廓 -->

  <!-- ===================================================== -->

  <path

    d="

    M514 328.1

    c39.2 0 77.2 7.7 113 22.8

    34.6 14.6 65.6 35.5 92.3 62.2

    s47.6 57.7 62.2 92.3

    c15.1 35.8 22.8 73.8 22.8 113

    s-7.7 77.2-22.8 113

    c-14.6 34.6-35.5 65.6-62.2 92.3

    s-57.7 47.6-92.3 62.2

    c-35.8 15.1-73.8 22.8-113 22.8

    s-77.2-7.7-113-22.8

    c-34.6-14.6-65.6-35.5-92.3-62.2

    s-47.6-57.7-62.2-92.3

    c-15.1-35.8-22.8-73.8-22.8-113

    s7.7-77.2 22.8-113

    c14.6-34.6 35.5-65.6 62.2-92.3

    s57.7-47.6 92.3-62.2

    c35.8-15.1 73.8-22.8 113-22.8

    z"

    fill="none"

    stroke="#303743"

    stroke-width="25"

    stroke-linejoin="round"

  />

  <!-- ===================================================== -->

  <!-- 叶子 -->

  <!-- ===================================================== -->

  <path

    d="

    M491.2 307.1

    h-0.5

    c-11-0.3-19.8-9.5-19.5-20.5

    1.1-44.5-18.8-82.1-59.4-111.6

    -32-23.3-65.2-32.7-65.5-32.8

    -10.6-3-16.9-14-13.9-24.6

    2.9-10.6 13.9-16.9 24.5-14

    1.6 0.4 39.6 11.1 77.4 38.3

    30.6 22.1 52.4 48.7 64.8 78.8

    8.6 20.8-2.2 43.7-2.8 67.4

    -0.2 10.9 5.7 19-5.1 19z"

    fill="#78AD84"

    stroke="#303743"

    stroke-width="20"

    stroke-linejoin="round"

  />

  <path

    d="

    M652.6 138.3

    c-2.3 26.7-16.8 50.5-27.1 64.3

    -15.5 20.8-36.4 39.7-59 53.1

    -21.2 12.6-42.2 19.5-59.2 19.5

    -1.4 0-2.8 0-4.1-0.1

    4.4-15.7 11.8-36.5 24-57

    14.1-23.7 31.8-42.4 52.5-55.7

    20.8-13.3 45.2-21.3 72.9-24.1

    m22-41

    c-195.3 0-216.9 200.7-216.9 200.7

    13.6 11.9 30.8 17.2 49.7 17.2

    87.6 0 211.8-114.4 180.7-217.6

    -4.7-0.2-9.1-0.3-13.5-0.3z"

    fill="#91BF91"

    stroke="#303743"

    stroke-width="20"

    stroke-linejoin="round"

  />

  <!-- ===================================================== -->

  <!-- 标签 -->

  <!-- ===================================================== -->

  <g

    transform="translate(660 700) rotate(-10)"

    filter="url(#tagShadow)"

  >

    <path

      d="

      M25 30

      Q25 8 47 8

      H190

      L278 96

      L190 184

      H47

      Q25 184 25 162

      Z"

      fill="white"

      stroke="#303743"

      stroke-width="16"

      stroke-linejoin="round"

    />

    <!-- 标签中的色盘 -->

    <path

      d="

      M47 45

      H183

      L234 96

      L183 147

      H47

      Z"

      fill="url(#tagGradient)"

    />

    <!-- 标签孔 -->

    <circle

      cx="73"

      cy="96"

      r="16"

      fill="white"

      stroke="#303743"

      stroke-width="9"

    />

    <!-- 标签文字/装饰 -->

    <path

      d="M110 70 H177"

      stroke="white"

      stroke-width="9"

      stroke-linecap="round"

      opacity="0.9"

    />

    <path

      d="M110 96 H198"

      stroke="white"

      stroke-width="9"

      stroke-linecap="round"

      opacity="0.9"

    />

    <path

      d="M110 122 H168"

      stroke="white"

      stroke-width="9"

      stroke-linecap="round"

      opacity="0.9"

    />

  </g>

</svg>
